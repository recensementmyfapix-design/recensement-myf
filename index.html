<style>
/* Layout : application de terrain — carte plein écran + navigation basse (mobile) / latérale (bureau).
   Identité : bleu APIX institutionnel, orange APIX en action, couleurs nationales réservées au drapeau. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface2:#eaeef4; --line:#d3dbe6; --fg:#14202e; --muted:#5a6878;
  --brand:#005193; --brand-ink:#ffffff; --brand-soft:#e1ecf6; --accent:#c8601a; --accent-soft:#fbeadd;
  --ok:#1d7a46; --ok-soft:#ddf1e5; --warn:#a86a00; --warn-soft:#fbefd2; --bad:#b4232c; --bad-soft:#f8dfe0;
  --parcel:#ffb000; --assiette:#ff3b30;
  --f-display:"Archivo","Segoe UI",Arial,sans-serif; --f-body:"Source Sans 3","Segoe UI",Roboto,Arial,sans-serif; --f-mono:"IBM Plex Mono",Consolas,monospace;
  --r:10px; --shadow:0 1px 2px rgba(10,30,60,.08),0 4px 14px rgba(10,30,60,.07);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d141d; --surface:#151f2b; --surface2:#1c2836; --line:#2b3a4c; --fg:#e6edf5; --muted:#9aa9ba;
  --brand:#4f9ad8; --brand-ink:#06121e; --brand-soft:#16304a; --accent:#ec8a4a; --accent-soft:#3b2414;
  --ok:#4cc985; --ok-soft:#173326; --warn:#e8b14a; --warn-soft:#3a2c10; --bad:#f07178; --bad-soft:#3d191c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d141d; --surface:#151f2b; --surface2:#1c2836; --line:#2b3a4c; --fg:#e6edf5; --muted:#9aa9ba;
  --brand:#4f9ad8; --brand-ink:#06121e; --brand-soft:#16304a; --accent:#ec8a4a; --accent-soft:#3b2414;
  --ok:#4cc985; --ok-soft:#173326; --warn:#e8b14a; --warn-soft:#3a2c10; --bad:#f07178; --bad-soft:#3d191c; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* Shell */
.app{display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);height:100%}
.app>*{min-width:0}
.top{display:flex;align-items:center;gap:12px;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:8px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.flag{width:34px;height:23px;flex:none;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.rep{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.rep b{font-family:var(--f-display);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.rep small{font-size:11px;color:var(--muted);font-style:italic}
.top .title{flex:1;min-width:0;text-align:center}
.top .title h1{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .title p{margin:0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.apix{display:flex;align-items:center;gap:8px;flex:none}
.apix img{height:34px;width:auto;background:#fff;border-radius:4px;padding:2px}
.apix .wordmark{font-family:var(--f-display);font-weight:800;color:var(--brand);font-size:13px;line-height:1.05;text-align:right}
.apix .wordmark span{display:block;font-weight:500;font-size:10px;color:var(--muted);letter-spacing:.04em}
.sync{font-size:11px;padding:3px 8px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.sync.on{background:var(--ok-soft);color:var(--ok)}
@media (max-width:640px){.rep small,.top .title p,.apix .wordmark span{display:none}.top .title h1{font-size:14px}.top{gap:8px}.rep b{font-size:10px;letter-spacing:.03em}}

.main{position:relative;overflow:hidden;display:grid;grid-template-columns:auto 1fr}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:10px 8px;gap:4px;width:210px}
.navbtn{display:flex;align-items:center;gap:10px;padding:10px 12px;border:0;background:none;border-radius:8px;cursor:pointer;text-align:left;font-weight:600;color:var(--muted)}
.navbtn svg{width:20px;height:20px;flex:none}
.navbtn[aria-current="page"]{background:var(--brand-soft);color:var(--brand)}
.navbtn:hover{background:var(--surface2)}
.side .credit{margin-top:auto;font-size:11px;color:var(--muted);padding:8px}
.bottom{display:none}
@media (max-width:900px){
  .main{grid-template-columns:1fr}.side{display:none}
  .bottom{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}

    } else if (el.dataset.pk) {
      const [pid, k] = el.dataset.pk.split("|"); const p = S.parcels[pid]; p[k] = el.value; debSave("parcels", p);
    } else if (el.dataset.rk) {

      p[arr].push(arr === "cultures" ? { nom: pap.principale || S.settings.bareme.cultures[0]?.nom || "", surface: "", evaluee: true } : arr === "arbres" ? { espece: "", type: "fruitier", nombre: "", prix: "" } : { nature: "", quantite: "", unite: "u", prix: "" });
      await save("parcels", p); renderFiche(); }

    else if (b.id === "fAddParcel") { go("carte"); toast(`Tracez la parcelle puis choisissez « ${papName(pap)} » dans la liste.`); startDraw(); }
    else if (b.id === "fDelete") confirmBox("Supprimer la fiche de " + papName(pap), "La fiche, ses photos et toutes ses parcelles seront supprimées de l'équipe.", "Supprimer définitivement", async () => {
      for (const p of papParcels(pap.id)) await remove("parcels", p.id);
      for (const [k] of PHOTO_KINDS) if (S.photos[pap.id + "_" + k]) await remove("photos", pap.id + "_" + k);
      await remove("paps", pap.id); refreshMap(); go("fiches"); toast("Fiche supprimée"); });
    else if (b.id === "fPdfRec") pdfRecensement(pap);
    else if (b.id === "fPdfEval") pdfEvaluation(pap);
    else if (b.id === "fUnlock") { DEVERROUILLE.add(pap.id); renderFiche(); toast("Fiche déverrouillée pour cette session"); }

}
function sigPad(c, pap) {
  const k = c.dataset.sig, ctx = c.getContext("2d");
  ctx.lineWidth = 3.2; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#0b1f3a";
  if (pap[k]) { const im = new Image(); im.onload = () => ctx.drawImage(im, 0, 0, c.width, c.height); im.src = pap[k]; }
  let drawing = false, last = null;
  const pt = (e) => { const r = c.getBoundingClientRect(); return [((e.clientX - r.left) / r.width) * c.width, ((e.clientY - r.top) / r.height) * c.height]; };
  c.onpointerdown = (e) => { drawing = true; last = pt(e); c.setPointerCapture(e.pointerId); };
  c.onpointermove = (e) => { if (!drawing) return; const p = pt(e); ctx.beginPath(); ctx.moveTo(...last); ctx.lineTo(...p); ctx.stroke(); last = p; };
  c.onpointerup = c.onpointercancel = () => { if (!drawing) return; drawing = false; pap[k] = c.toDataURL("image/png"); save("paps", pap); renderControle(); const hint = c.parentElement.querySelector(".hint"); if (hint) hint.textContent = "Signature enregistrée"; };
}
function compressImage(file, maxSide = 1100, q = 0.62) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const im = new Image();
    im.onload = () => { const s = Math.min(1, maxSide / Math.max(im.width, im.height)); const cv = document.createElement("canvas"); cv.width = Math.round(im.width * s); cv.height = Math.round(im.height * s);
      cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
      let d = cv.toDataURL("image/jpeg", q); if (d.length > 230000) d = cv.toDataURL("image/jpeg", 0.45); if (d.length > 230000) { const c2 = document.createElement("canvas"); c2.width = cv.width * 0.7; c2.height = cv.height * 0.7; c2.getContext("2d").drawImage(cv, 0, 0, c2.width, c2.height); d = c2.toDataURL("image/jpeg", 0.5); }
      res(d); };
    im.onerror = rej; im.src = url;
  });
}
async function handlePhoto(pap, kind, file) {
  if (!file) return;
  try { const data = await compressImage(file); await save("photos", { id: pap.id + "_" + kind, papId: pap.id, kind, data }); renderFiche(); toast("Photo enregistrée"); }
  catch (e) { toast("Cette image n'a pas pu être lue. Réessayez avec une photo JPEG ou PNG."); }
}

function miniMapSVG() {
  const b = SAT.hi.bounds; const W = 640, H = Math.round(W * ((b[1][0] - b[0][0]) / (b[1][1] - b[0][1])) / Math.cos((13.28 * Math.PI) / 180));
  const px = ([lat, lon]) => [((lon - b[0][1]) / (b[1][1] - b[0][1])) * W, ((b[1][0] - lat) / (b[1][0] - b[0][0])) * H];
  const ext = ASSIETTE_LL.map(px); const xs = ext.map((p) => p[0]), ys = ext.map((p) => p[1]);
  const pad = 40, vx = Math.min(...xs) - pad, vy = Math.min(...ys) - pad, vw = Math.max(...xs) - vx + pad, vh = Math.max(...ys) - vy + pad;
  const polys = Object.values(S.parcels).filter((p) => p.geom).map((p) => {
    const rings = p.geom.type === "Polygon" ? [p.geom.coordinates] : p.geom.coordinates;
    const c = STATUT_COLOR[S.paps[p.papId]?.statut || "recense"];
    const d = rings.map((poly) => poly.map((r) => "M" + r.map(([lo, la]) => px([la, lo]).map((v) => v.toFixed(1)).join(",")).join("L") + "Z").join("")).join("");
    const ctr = turf.centroid(turf.feature(p.geom)).geometry.coordinates; const [cx, cy] = px([ctr[1], ctr[0]]);
    return `<path d="${d}" fill="${c}" fill-opacity=".45" stroke="${c}" stroke-width="1.5" fill-rule="evenodd"/><text x="${cx}" y="${cy}" font-size="${vw / 45}" text-anchor="middle" dominant-baseline="middle" fill="#fff" stroke="#000" stroke-width=".6" paint-order="stroke" font-family="IBM Plex Mono,monospace" font-weight="600">${h(p.code)}</text>`;
  }).join("");
  return `<svg class="minimap" viewBox="${vx} ${vy} ${vw} ${vh}" role="img" aria-label="Plan des parcelles recensées dans l'emprise"><image href="${SAT.hi.src}" x="0" y="0" width="${W}" height="${H}" preserveAspectRatio="none"/>
  <polygon points="${ext.map((p) => p.join(",")).join(" ")}" fill="none" stroke="#ff3b30" stroke-width="${vw / 220}" stroke-dasharray="${vw / 60} ${vw / 110}"/>${polys}
  ${ASSIETTE_UTM.map((bn, i) => `<text x="${ext[i][0]}" y="${ext[i][1] - vw / 70}" font-size="${vw / 38}" text-anchor="middle" fill="#fff" stroke="#b4232c" stroke-width="1" paint-order="stroke" font-weight="700">${bn.id}</text>`).join("")}</svg>`;
}

/* ---------- Documents officiels de la CDREI (modèles de la Préfecture de Médina Yoro Foulah) ---------- */
const PG = { L: 22, R: 22, W: 210 - 44, top: 16, bottom: 278 };
const imgFmt = (u) => (/^data:image\/png/i.test(u) ? "PNG" : "JPEG");
async function outPdf(name, d, opt) { const blob = d.output("blob"); if (opt && opt.ret) return { name, blob, doc: d }; await saveFile(name, blob); }
/* Police Liberation Sans (licence OFL, mêmes chasses qu'Arial/Helvetica) intégrée aux PDF : accents et « m² » s'affichent partout */
const PDF_FONT = { fam: "helvetica", data: null };
async function ensureFonts() {
  if (PDF_FONT.data) return;
  try {
    if (window.PDF_FONTS_B64) PDF_FONT.data = window.PDF_FONTS_B64;
    else {
      const get = async (f) => { const r = await fetch("fonts/" + f); if (!r.ok) throw new Error("police"); const u = new Uint8Array(await r.arrayBuffer()); let s = ""; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
      PDF_FONT.data = { normal: await get("LiberationSans-Regular.ttf"), bold: await get("LiberationSans-Bold.ttf"), italic: await get("LiberationSans-Italic.ttf") };
    }
    PDF_FONT.fam = "LS"; TBL.styles.font = "LS";
  } catch (e) { PDF_FONT.data = null; PDF_FONT.fam = "helvetica"; }
}
function newDoc() { const { jsPDF } = window.jspdf; const d = new jsPDF({ unit: "mm", format: "a4" });
  if (PDF_FONT.data) for (const st of ["normal", "bold", "italic"]) { d.addFileToVFS(`LS-${st}.ttf`, PDF_FONT.data[st]); d.addFont(`LS-${st}.ttf`, "LS", st); }
  d.setFont(PDF_FONT.fam, "normal"); d.setTextColor(0, 0, 0); d.setDrawColor(0, 0, 0); return d; }
function setSt(d, st = "") { const lsf = PDF_FONT.fam === "LS"; d.setFont(PDF_FONT.fam, st.includes("b") && st.includes("i") ? (lsf ? "bold" : "bolditalic") : st.includes("b") ? "bold" : st.includes("i") ? "italic" : "normal"); }
const pageW = (d) => d.internal.pageSize.getWidth(), pageH = (d) => d.internal.pageSize.getHeight();
/* Largeur réelle d'un mot : somme des chasses sans crénage (le rendu PDF n'applique pas de crénage) */
const mw = (d, t) => PDF_FONT.fam === "LS" ? d.getTextWidth(t) : [...t].reduce((a, c) => a + d.getStringUnitWidth(c), 0) * d.getFontSize() / d.internal.scaleFactor * 1.022;
/* Texte riche : segments [texte, style] (b = gras, i = italique, u = souligné), justifié comme dans les modèles */
function rich(d, y, segs, o = {}) {
  const size = o.size || 10.5, x = o.x ?? PG.L, w = o.w ?? pageW(d) - PG.L - PG.R, lh = o.lh || size * 0.62, align = o.align || "justify";
  d.setFontSize(size);
  // mots = suites de fragments sans espace entre eux (le style peut changer à l'intérieur d'un mot)
  const words = []; let pendingSpace = false;
  for (const sg of segs) { const [t, st] = typeof sg === "string" ? [sg, ""] : sg;
    for (const p of String(t).split(/(\s+)/)) { if (!p) continue; if (/^\s+$/.test(p)) { pendingSpace = true; continue; }
      if (!words.length || pendingSpace) words.push({ parts: [] }); words[words.length - 1].parts.push({ t: p, st }); pendingSpace = false; } }
  words.forEach((wd) => { wd.parts.forEach((pt) => { setSt(d, pt.st); pt.w = mw(d, pt.t); }); wd.w = wd.parts.reduce((a, pt) => a + pt.w, 0); });
  setSt(d, ""); const spW = mw(d, " ") * (PDF_FONT.fam === "LS" ? 1 : 1.15);
  const lines = []; let cur = [], cw = 0;
  for (const wd of words) { const add = (cur.length ? spW : 0) + wd.w; if (cur.length && cw + add > w) { lines.push(cur); cur = [wd]; cw = wd.w; } else { cur.push(wd); cw += add; } }
  if (cur.length) lines.push(cur);
  lines.forEach((ln, li) => {
    if (y > PG.bottom) { d.addPage(); y = PG.top + 4; }
    const tw = ln.reduce((a, t) => a + t.w, 0), gaps = ln.length - 1, natural = tw + gaps * spW;
    let sp = spW, xx = x;
    if (align === "justify" && li < lines.length - 1 && gaps > 0) sp = (w - tw) / gaps;
    else if (align === "center") xx = x + (w - natural) / 2;
    else if (align === "right") xx = x + w - natural;
    for (const wd of ln) { for (const pt of wd.parts) { setSt(d, pt.st); d.text(pt.t, xx, y); if (pt.st.includes("u")) { d.setLineWidth(0.25); d.line(xx, y + 0.8, xx + pt.w, y + 0.8); } xx += pt.w; } xx += sp; }
    y += lh;
  });
  setSt(d, ""); return y + (o.after ?? 2.6);
}
const ctr = (d, y, t, st = "b", size = 10.5, after = 0) => rich(d, y, [[t, st]], { size, align: "center", after });
/* En-tête des actes et fiches d'évaluation */
function enteteCDREI(d) {
  let y = PG.top + 2;

  y = ctr(d, y - 0.8, "Un Peuple - Un But - Une Foi", "", 8.5, 0); y = ctr(d, y - 1.2, "----------", "", 8.5, 0.6);
  y = ctr(d, y, "REGION DE KOLDA", "b", 10.5, 0); y = ctr(d, y - 1.2, "----------", "", 8.5, 0.6);
  y = ctr(d, y, "DEPARTEMENT DE MEDINA YORO FOULAH", "b", 10.5, 0.6);
  y = rich(d, y, [["COMMISSION DEPARTEMENTALE DE RECENSEMENT ET D'EVALUATION DES IMPENSES (CDREI)", "b"]], { size: 10.5, align: "center", x: 40, w: 130, after: 0 });
  return y + 6;
}
function titreEncadre(d, y, t, size = 13) {
  d.setLineWidth(0.3); d.rect(PG.L - 2, y - 5.5, pageW(d) - PG.L - PG.R + 4, 9);
  setSt(d, "b"); d.setFontSize(size); d.text(t, pageW(d) / 2, y + 0.6, { align: "center" }); setSt(d, ""); return y + 12;
}
/* Emplacement réservé à la signature et au cachet (environ 55 mm de hauteur) */
function blocSignature(d, cx, y, titre, nom, h = 55) {

function numeroter(d, from, to, style = "n/N") {
  const n = to - from + 1; for (let i = from; i <= to; i++) { d.setPage(i); setSt(d, ""); d.setFontSize(9); const lab = style === "n" ? String(i - from + 1) : `${i - from + 1}/${n}`; d.text(lab, pageW(d) - PG.R, pageH(d) - 10, { align: "right" }); }

}
const TBL = { theme: "grid", styles: { font: "helvetica", fontSize: 10, textColor: [0, 0, 0], lineColor: [0, 0, 0], lineWidth: 0.2, cellPadding: { top: 1.4, bottom: 1.4, left: 2, right: 2 } }, headStyles: { fillColor: [255, 255, 255], textColor: [0, 0, 0], fontStyle: "bold", halign: "center", valign: "middle" }, margin: { left: PG.L, right: PG.R } };
const fM2 = (n) => grp(Math.round(n * 100) / 100, (Math.round(n * 100) / 100) % 1 ? 2 : 0) + " m²";
const fPU = (n) => grp(n, 3) + " F";

const dateLieu = () => `A ${S.settings.lieu || "Médina Yoro Foulah"}, le ${S.settings.dateConciliation ? frDate(S.settings.dateConciliation) .replace(/^(\d+)\/(\d+)\/(\d+)$/, (m, a, b, c) => `${a} ${MOIS[+b - 1]} ${c}`) : "……………………"}`;
function papLines(p) { const e = evaluate(p); return { e, lines: e.lines }; }
function enquete(p) {

/* Plan parcellaire (annexe des fiches) */
function planParcelles(d, x, y, w, hgt, highlight) {
  const pts = ASSIETTE_UTM.map((b) => [b.x, b.y]); const allp = [...pts];
  const parcs = Object.values(S.parcels).filter((p) => p.geom);
  const ringsOf = (g) => (g.type === "Polygon" ? [g.coordinates] : g.coordinates).map((poly) => poly.map((r) => r.map(([lo, la]) => UTM.fwd(la, lo))));
  const P = parcs.map((p) => ({ p, rings: ringsOf(p.geom) })); P.forEach((q) => q.rings.forEach((poly) => poly.forEach((r) => allp.push(...r))));
  const minx = Math.min(...allp.map((a) => a[0])), maxx = Math.max(...allp.map((a) => a[0])), miny = Math.min(...allp.map((a) => a[1])), maxy = Math.max(...allp.map((a) => a[1]));
  const sc = Math.min((w - 12) / (maxx - minx), (hgt - 12) / (maxy - miny)); const ox = x + (w - (maxx - minx) * sc) / 2, oy = y + (hgt - (maxy - miny) * sc) / 2;
  const Tf = ([X, Y]) => [ox + (X - minx) * sc, oy + (maxy - Y) * sc];
  d.setDrawColor(0, 0, 0); d.setLineWidth(0.3); d.rect(x, y, w, hgt);
  const poly = (ring, style) => { const t = ring.map(Tf); d.lines(t.slice(1).map((p, i) => [p[0] - t[i][0], p[1] - t[i][1]]), t[0][0], t[0][1], [1, 1], style, true); };
  for (const q of P) { const hl = !highlight || highlight.includes(q.p.id); d.setFillColor(...(hl ? [255, 214, 120] : [238, 238, 238])); d.setDrawColor(0, 0, 0); d.setLineWidth(hl ? 0.45 : 0.2); q.rings.forEach((pl) => pl.forEach((r) => poly(r, "FD"))); }
  d.setDrawColor(200, 0, 0); d.setLineWidth(0.6); d.setLineDashPattern([2, 1.2], 0); poly([...pts, pts[0]], "S"); d.setLineDashPattern([], 0); d.setDrawColor(0, 0, 0);
  setSt(d, "b"); d.setFontSize(7); d.setTextColor(180, 0, 0); ASSIETTE_UTM.forEach((b) => { const [tx, ty] = Tf([b.x, b.y]); d.text(b.id, tx, ty - 1.4, { align: "center" }); }); d.setTextColor(0, 0, 0);
  d.setFontSize(6.5); for (const q of P) { const c = turf.centroid(turf.feature(q.p.geom)).geometry.coordinates; const [tx, ty] = Tf(UTM.fwd(c[1], c[0])); d.text(q.p.code, tx, ty, { align: "center", baseline: "middle" }); }
  d.setFontSize(8); d.text("N", x + w - 6, y + 6, { align: "center" }); d.setLineWidth(0.4); d.line(x + w - 6, y + 14, x + w - 6, y + 7.5); d.lines([[-1.4, 2.2], [2.8, 0]], x + w - 6, y + 7.5, [1, 1], "F", true);
  const lenM = [50, 100, 200, 250, 500].find((m) => m * sc > w * 0.18) || 500; d.setLineWidth(0.6); d.line(x + 4, y + hgt - 5, x + 4 + lenM * sc, y + hgt - 5); setSt(d, ""); d.setFontSize(6.5); d.text(`${lenM} m`, x + 4 + (lenM * sc) / 2, y + hgt - 6.5, { align: "center" });
  d.text("Emprise de l'extension (20 ha) en pointillés rouges", x + w - 3, y + hgt - 3, { align: "right" });
}

function ouvrirDepuisLien(essai = 0) {
  const m = location.hash.match(/^#fiche-([a-z0-9]+)$/i); if (!m) return;
  if (S.paps[m[1]]) { go("fiche", { pap: m[1] }); return; }
  if (essai < 6) setTimeout(() => ouvrirDepuisLien(essai + 1), 2500); else toast("Fiche introuvable sur cet appareil : vérifiez le code de mission et la connexion.");
}
function firstRun() {
  const svc = servicesList();
  modal(`<div class="eyebrow">Bienvenue</div><h2>Rejoindre la mission de recensement</h2><p style="margin:0;color:var(--muted)">Ces informations sont demandées une seule fois sur ce téléphone.</p>
    <div class="field"><label for="frCode" class="req">Code de mission</label><input id="frCode" autocomplete="off" autocapitalize="characters"></div>
    <div class="field"><label for="frName" class="req">Votre prénom et nom</label><input id="frName" value="${h(localPref("agent"))}"></div>
    <div class="field"><label for="frSvc">Votre service</label><select id="frSvc">${opt(svc, localPref("service") || svc[0])}</select></div>
    <div id="frMsg" class="warnbox" hidden></div>
    <div class="row" style="justify-content:flex-end"><button class="btn" data-close>Plus tard</button><button class="btn primary" id="frOk">Rejoindre</button></div>`,
    { onMount: (b) => ($("#frOk", b).onclick = async () => {
      const code = $("#frCode").value.trim(), name = $("#frName").value.trim(); const msg = $("#frMsg");
      if (!code || !name) { msg.hidden = false; msg.textContent = "Le code de mission et votre nom sont nécessaires."; return; }
      localPref("token", code); localPref("agent", name); localPref("service", $("#frSvc").value);
      try { await GAS.call({ action: "ping" }, 20000); closeModal(); toast("Connecté à la mission"); localPref("lastSync", "0"); GAS.sync(); }
      catch (e) { if (/Code/.test(e.message)) { localPref("token", ""); msg.hidden = false; msg.textContent = "Code de mission incorrect."; } else { closeModal(); toast("Pas de réseau : la connexion se fera automatiquement plus tard."); } setSync(); }
    }) });
}

/* ---------- Démarrage ---------- */
(async function boot() {
  renderNav(); renderApix(); setSync();
  await loadLocal(); renderApix();
  initMap(); go("carte"); ouvrirDepuisLien(); window.addEventListener("hashchange", () => ouvrirDepuisLien());
  initCloud();
  if (!IN_FRAME) {
    GAS.pending = (await Local.all("outbox")).length; setSync();
    window.addEventListener("online", () => GAS.schedule(500)); window.addEventListener("offline", setSync);
    setInterval(() => GAS.sync(), 45000); GAS.schedule(800);
    if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
    if (GAS.url() && !GAS.token()) firstRun();
  }
  if (IN_FRAME) document.documentElement.classList.add("in-frame");
})();

</script>
</body></html>
